<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Recipe</title>
    <link rel="stylesheet" href="styles/main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="page">
      <header>
        <!-- Include a reusable header component -->
        <!-- Example: -->
        <!-- <include src="components/header.html"></include> -->
      </header>

      <main>
        <h1>Let's create a new recipe!</h1>
        <p>
          Fill out the recipe card below and press the "add" button when you're
          done.
        </p>
        <form onsubmit="return createRecipe(event)" class="recipe-form">
          <fieldset>
            <label for="name" class="main">Recipe Name:</label>
            <input
              required
              type="text"
              id="name"
              name="name"
              placeholder="curry"
              class="text-field"
            />
            <label for="prep-time" class="main">Prep Time</label>
            <input
              required
              type="number"
              id="prep-time"
              name="prep_time_mins"
              placeholder="15"
              class="text-field"
            />
            <label for="cooking-time" class="main"
              >Cooking Time (in minutes):</label
            >
            <input
              required
              type="number"
              id="cooking-time"
              name="cook_time_mins"
              placeholder="150"
              class="text-field"
            />
            <label for="ingredients-list" class="main">Ingredients List:</label>
            <textarea
              required
              id="ingredients-list"
              name="ingredients"
              row="3"
              placeholder="300g rice, 3 medium chicken breasts, etc"
            ></textarea>
            <label for="cooking-instructions" class="main"
              >Cooking Instructions:</label
            >
            <textarea
              required
              id="cooking-instructions"
              row="3"
              name="instructions"
              placeholder="chop onions, chop carrots, cook rice, etc"
            ></textarea>
          </fieldset>
          <fieldset>
            <legend>Difficulty</legend>
            <div class="difficulty">
              <label for="difficulty-beginner"
                ><input
                  required
                  type="radio"
                  id="difficulty-beginner"
                  name="difficulty"
                  value="beginner"
                /><span>Beginner</span></label
              >
              <label for="difficulty-easy"
                ><input
                  required
                  type="radio"
                  id="difficulty-easy"
                  name="difficulty"
                  value="easy"
                />Easy</label
              >
              <label for="difficulty-medium"
                ><input
                  required
                  type="radio"
                  id="difficulty-medium"
                  name="difficulty"
                  value="medium"
                />Medium</label
              >
              <label for="difficulty-hard"
                ><input
                  required
                  type="radio"
                  id="difficulty-hard"
                  name="difficulty"
                  value="hard"
                />Hard</label
              >
            </div>
          </fieldset>
          <div class="actions">
            <a href="/" class="btn btn-secondary">cancel</a>
            <button type="submit" class="btn btn-primary">save</button>
          </div>
        </form>
      </main>

      <footer>
        <!-- Include a reusable footer component -->
      </footer>
    </div>
    <script src="scripts/recipe.js"></script>
  </body>
</html>
