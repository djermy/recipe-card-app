<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Recipe</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <div class="page">
    <header>
      <!-- Include a reusable header component -->
      <!-- Example: -->
      <!-- <include src="components/header.html"></include> -->
    </header>

    <main>
      <h1>Let's create a new recipe!</h1>
      <p>Fill out the recipe card below and press the "add" button when you're done.</p>
      <form action="/recipe">
        <fieldset>
          <legend>name of recipe.</legend>
          <input required type="text" name="name" placeholder="curry">
        </fieldset>
        <fieldset>
          <legend>cook time in minutes</legend>
          <input required type="number" name="cook_time_mins" placeholder="150">
        </fieldset>
        <fieldset>
          <legend>what difficulty level is this recipe?</legend>
          <label><input required type="radio" name="difficulty" value="beginner">beginner</label>
          <label><input required type="radio" name="difficulty" value="easy">easy</label>
          <label><input required type="radio" name="difficulty" value="medium">medium</label>
          <label><input required type="radio" name="difficulty" value="hard">hard</label>
        </fieldset>
        <fieldset>
          <legend>ingredients list.</legend>
          <input required type="text" name="ingredients" placeholder="300g rice, 3 medium chicken breasts, etc">
        </fieldset>
        <fieldset>
          <legend>cooking instructions.</legend>
          <input required type="text" name="description">
        </fieldset>
        <button type="submit">add</button>
      </form>
    </main>

    <footer>
      <!-- Include a reusable footer component -->
    </footer>
  </div>
  <script src="scripts/main.js"></script>
</body>
</html
